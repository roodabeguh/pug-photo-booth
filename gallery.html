<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your photo — Secret Pug Petting Zoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Shrikhand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f2dcb6; --surface: #fbf0de; --ink: #2c1430; --muted: #6e5266;
    --accent: #d9396f; --accent-ink: #fff6ea; --line: #d8bc90; --film: #fbfaf6;
    --display: "Shrikhand", "Cooper Black", Georgia, serif;
    --body: "Figtree", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #22111f; --surface: #2f1a2c; --ink: #f6e6cf; --muted: #c9a9bd;
      --accent: #ff6f9f; --accent-ink: #22111f; --line: #4a2d45;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
  [hidden] { display: none !important; }
  a, button { color: inherit; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  header { padding: 28px 20px 8px; text-align: center; }
  .brand { font-family: var(--display); font-size: 22px; margin: 0; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 9vw, 56px); line-height: 1.05; margin: 10px 0 6px; text-transform: capitalize; }
  .sub { color: var(--muted); margin: 0; font-size: 17px; }

  /* Single photo (from the QR code) */
  .solo { display: grid; justify-items: center; padding: 20px 20px 8px; }
  .solo img {
    width: min(360px, 82vw); height: auto; display: block; background: var(--film);
    box-shadow: 0 2px 0 rgba(44,20,48,.08), 0 24px 50px -12px rgba(44,20,48,.45);
    -webkit-touch-callout: default;
  }
  .choices { display: grid; gap: 12px; width: min(360px, 90vw); margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 58px; padding: 0 24px; border-radius: 999px; border: 0;
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 18px;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 55%, var(--ink));
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, var(--ink)); }
  .btn.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.quiet:active { transform: none; }
  .tip { color: var(--muted); font-size: 15px; margin: 14px 0 0; text-align: center; }

  /* Gallery grid */
  .toolbar {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    flex-wrap: wrap; max-width: 1100px; margin: 40px auto 14px; padding: 0 20px;
  }
  .section-title { font-weight: 800; font-size: 18px; margin: 0; }
  .toolbar .btn { min-height: 50px; padding: 0 24px; font-size: 17px; }
  .toolbar .btn[disabled] { opacity: .6; }
  .grid {
    display: grid; gap: 18px; padding: 0 20px 48px; max-width: 1100px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .grid button { border: 0; padding: 0; background: none; }
  .grid img {
    width: 100%; aspect-ratio: 54 / 86; object-fit: cover; display: block; background: var(--film);
    box-shadow: 0 10px 22px -10px rgba(44,20,48,.45);
  }
  .notice { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 18px; }

  dialog {
    border: 0; padding: 20px; background: var(--surface); color: var(--ink);
    border-radius: 24px; width: min(440px, 92vw); text-align: center;
  }
  dialog::backdrop { background: rgba(20, 8, 20, .7); }
  dialog img { width: 100%; height: auto; display: block; -webkit-touch-callout: default; }
  dialog .choices { margin: 18px auto 0; }
</style>
</head>
<body>

<header>
  <p class="brand">Secret Pug Petting Zoo</p>
  <h1 id="title">Photo gallery</h1>
  <p class="sub" id="sub"></p>
</header>

<section class="solo" id="solo" hidden>
  <img id="soloImg" alt="Your photo from the booth">
  <p class="tip">Pick the size for where you're posting.</p>
  <div class="choices" id="soloChoices"></div>
</section>

<div class="toolbar" id="toolbar" hidden>
  <p class="section-title">Everyone&rsquo;s photos</p>
  <button class="btn" id="downloadAll">Download all</button>
</div>
<div class="grid" id="grid"></div>
<p class="notice" id="notice" hidden></p>

<dialog id="viewer">
  <img id="viewerImg" alt="Booth photo">
  <div class="choices" id="viewerChoices"></div>
  <div class="choices"><button class="btn quiet" id="viewerClose">Close</button></div>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const event = params.get("event") || "";
  const single = params.get("photo") || "";
  const ID_PATTERN = /^\d{13}-[0-9a-f]{8}\.jpg$/;

  // Each photo is saved in all three shapes.
  const VARIANTS = [
    { key: "",      folder: "original", label: "Save original photo" },
    { key: "post",  folder: "post",     label: "Save for Instagram Post" },
    { key: "story", folder: "story",    label: "Save for Instagram or TikTok Story and Reel" },
  ];

  const shown = new Set();
  let viewing = null;

  const variantName = (id, key) => (key ? id.replace(/\.jpg$/, `-${key}.jpg`) : id);
  const urlFor = (id, key = "") => `/photo/${event}/${variantName(id, key)}`;

  function makeButtons(container, onPick) {
    container.innerHTML = "";
    VARIANTS.forEach((v) => {
      const b = document.createElement("button");
      b.className = "btn" + (v.key ? "" : " quiet");
      b.textContent = v.label;
      b.addEventListener("click", () => onPick(v));
      container.append(b);
    });
  }

  async function savePhoto(id, v) {
    const url = urlFor(id, v.key);
    try {
      const blob = await (await fetch(url)).blob();
      const name = `secret-pug-${v.folder}.jpg`;
      const file = new File([blob], name, { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });   // iPhone: tap "Save Image"
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (err) {
      if (err && err.name === "AbortError") return;   // guest closed the share sheet
      window.open(url, "_blank");
    }
  }

  if (!/^[a-z0-9-]{3,60}$/.test(event)) {
    $("#notice").textContent = "This gallery link is incomplete. Scan the code at the booth again.";
    $("#notice").hidden = false;
    return;
  }

  $("#title").textContent = (event.replace(/-\d{8}-[a-z0-9]{3,8}$/, "").replace(/-[a-z0-9]{3,8}$/, "") || "Photo gallery").replace(/-/g, " ");

  if (ID_PATTERN.test(single)) {
    $("#solo").hidden = false;
    $("#soloImg").src = urlFor(single);
    $("#sub").textContent = "Here's your photo.";
    makeButtons($("#soloChoices"), (v) => savePhoto(single, v));
  }

  function open(id) {
    viewing = id;
    $("#viewerImg").src = urlFor(id);
    makeButtons($("#viewerChoices"), (v) => viewing && savePhoto(viewing, v));
    $("#viewer").showModal();
  }
  $("#viewerClose").addEventListener("click", () => $("#viewer").close());
  $("#viewer").addEventListener("click", (e) => { if (e.target === $("#viewer")) $("#viewer").close(); });

  async function refresh() {
    try {
      const res = await fetch(`/api/photos?event=${event}`, { cache: "no-store" });
      const data = await res.json();
      if (!data.ok) throw new Error();
      const grid = $("#grid");
      const fresh = data.photos.filter((id) => !shown.has(id));
      fresh.reverse().forEach((id) => {
        shown.add(id);
        const b = document.createElement("button");
        b.setAttribute("aria-label", "Open photo");
        const img = document.createElement("img");
        img.loading = "lazy"; img.alt = "Booth photo"; img.src = urlFor(id);
        b.appendChild(img);
        b.addEventListener("click", () => open(id));
        grid.prepend(b);
      });
      $("#toolbar").hidden = shown.size === 0;
      if (!single) {
        $("#sub").textContent = shown.size
          ? `${shown.size} photo${shown.size === 1 ? "" : "s"} so far`
          : "";
        $("#notice").textContent = "No photos yet. They'll show up here as guests visit the booth.";
        $("#notice").hidden = shown.size > 0;
      }
    } catch {
      if (!shown.size) {
        $("#notice").textContent = "The gallery didn't load. Check your connection and refresh.";
        $("#notice").hidden = false;
      }
    }
  }

  // Download all: one zip with three folders (original, post, story).
  const pad = (n) => String(n).padStart(2, "0");
  function fileStamp(id, seq) {
    const d = new Date(Number(id.slice(0, 13)));
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_` +
           `${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_` +
           `${String(seq).padStart(3, "0")}.jpg`;
  }

  $("#downloadAll").addEventListener("click", async () => {
    const btn = $("#downloadAll");
    const ids = [...shown];
    if (!ids.length) return;
    const original = btn.textContent;
    btn.disabled = true;
    try {
      const zip = new JSZip();
      for (let i = 0; i < ids.length; i++) {
        for (const v of VARIANTS) {
          btn.textContent = `Getting ${i + 1} of ${ids.length}\u2026`;
          const blob = await (await fetch(urlFor(ids[i], v.key))).blob();
          zip.file(`${v.folder}/${fileStamp(ids[i], i + 1)}`, blob);
        }
      }
      btn.textContent = "Zipping\u2026";
      const out = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(out);
      a.download = `${event}-photos.zip`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch {
      alert("The download didn't finish. Check your connection and try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  refresh();
  setInterval(refresh, 20000);
})();
</script>
</body>
</html>
